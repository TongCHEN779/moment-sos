name: TestPyPI
on:
  workflow_dispatch:          # run by hand from the Actions tab
jobs:
  testpypi:
    runs-on: ubuntu-24.04
    permissions: {id-token: write}      # trusted publishing: configure the TestPyPI project first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: "https://test.pypi.org/legacy/"}
